name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main, "feat/*"]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify Python 3.10 error-code import
        if: matrix.python-version == '3.10'
        run: python -c "from infralink.cli.errors import ErrorCode; print(ErrorCode.__name__)"
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src scripts
      - name: Test
        run: python -m pytest
      - name: Verify deterministic schemas and clean source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_cli_schemas.py
          first="$(find src/infralink/schemas -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          python scripts/generate_cli_schemas.py
          second="$(find src/infralink/schemas -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          test "$first" = "$second"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard src/infralink/schemas)"

  security:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify public-data boundary
        run: python -m pytest tests/test_public_data_boundary.py -q --no-cov
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan repository
        run: gitleaks detect --source . --no-banner --redact

  package:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install -e ".[dev]"
      - name: Build validation artifacts once
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Prepare offline wheelhouses
        shell: bash
        run: |
          set -euo pipefail
          mkdir base-wheelhouse bws-wheelhouse
          python -m pip download --dest base-wheelhouse dist/infralink-0.2.0-py3-none-any.whl
          cp base-wheelhouse/* bws-wheelhouse/
          python -m pip download --dest bws-wheelhouse "bitwarden-sdk>=2.1,<3"
      - name: Smoke-test base wheel offline
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/base-smoke"
          PIP_NO_INDEX=1 "$RUNNER_TEMP/base-smoke/bin/python" -m pip install \
            --find-links base-wheelhouse dist/infralink-0.2.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/base-smoke/bin/python" -c \
            "from pathlib import Path; import importlib.util, infralink; location = Path(infralink.__file__).resolve(); assert Path('$RUNNER_TEMP/base-smoke').resolve() in location.parents; assert importlib.util.find_spec('bitwarden_sdk') is None; assert infralink.__version__ == '0.2.0'"
          env -u PYTHONPATH "$RUNNER_TEMP/base-smoke/bin/python" -m infralink version \
            > "$RUNNER_TEMP/module-version.json"
          env -u PYTHONPATH "$RUNNER_TEMP/base-smoke/bin/infralink" version \
            > "$RUNNER_TEMP/entry-version.json"
      - name: Smoke-test optional BWS extra offline
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/bws-smoke"
          PIP_NO_INDEX=1 "$RUNNER_TEMP/bws-smoke/bin/python" -m pip install \
            --find-links bws-wheelhouse \
            "dist/infralink-0.2.0-py3-none-any.whl[bws]"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/bws-smoke/bin/python" -c \
            "import bitwarden_sdk; from infralink.adapters.bws import BwsSecretResolver"
      - name: Scan installed output and artifacts for the secret canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/artifact-scan"
          tar -xzf dist/infralink-0.2.0.tar.gz -C "$RUNNER_TEMP/artifact-scan"
          unzip -q dist/infralink-0.2.0-py3-none-any.whl \
            -d "$RUNNER_TEMP/artifact-scan/wheel"
          ! rg -a "infralink-secret-canary-47291" \
            "$RUNNER_TEMP/artifact-scan" \
            "$RUNNER_TEMP/module-version.json" "$RUNNER_TEMP/entry-version.json"
