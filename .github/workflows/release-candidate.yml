name: Release candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA; select the same ref in Run workflow
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Reject a workflow ref different from source_sha
        if: inputs.source_sha != github.sha
        run: exit 2
      - name: Require selected ref to match requested source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          SELECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 2
          fi
          test "$REQUESTED_SHA" = "$SELECTED_SHA"
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          verified_sha="$(git rev-parse HEAD)"
          test "$verified_sha" = "$REQUESTED_SHA"
          test -z "$(git status --porcelain)"
          echo "VERIFIED_SHA=$verified_sha" >> "$GITHUB_ENV"
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src scripts
      - name: Test without package build
        run: python -m pytest
      - name: Verify deterministic schemas and clean source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_cli_schemas.py
          first="$(find src/infralink/schemas -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          python scripts/generate_cli_schemas.py
          second="$(find src/infralink/schemas -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          test "$first" = "$second"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard src/infralink/schemas)"
      - name: Verify public-data boundary
        run: python -m pytest tests/test_public_data_boundary.py -q --no-cov
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan repository
        run: gitleaks detect --source . --no-banner --redact
      - name: Prepare offline smoke-test wheelhouses
        shell: bash
        run: |
          set -euo pipefail
          mkdir base-wheelhouse bws-wheelhouse
          python -m pip download --only-binary=:all: --dest base-wheelhouse \
            "pyyaml>=6.0" "click>=8.0" "rich>=13.0" "jinja2>=3.0" "pydantic>=2.11,<3"
          cp base-wheelhouse/* bws-wheelhouse/
          python -m pip download --only-binary=:all: --dest bws-wheelhouse \
            "bitwarden-sdk>=2.1,<3"
      - name: Build candidate wheel and sdist once
        run: python -m build
      - name: Validate candidate metadata
        run: python -m twine check dist/*
      - name: Smoke-test exact base wheel offline
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/base-candidate"
          PIP_NO_INDEX=1 "$RUNNER_TEMP/base-candidate/bin/python" -m pip install \
            --find-links base-wheelhouse dist/infralink-0.2.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/base-candidate/bin/python" -c \
            "from pathlib import Path; import importlib.util, infralink; location = Path(infralink.__file__).resolve(); assert Path('$RUNNER_TEMP/base-candidate').resolve() in location.parents; assert importlib.util.find_spec('bitwarden_sdk') is None; assert infralink.__version__ == '0.2.0'"
          env -u PYTHONPATH "$RUNNER_TEMP/base-candidate/bin/python" -m infralink version \
            > "$RUNNER_TEMP/module-version.json"
          env -u PYTHONPATH "$RUNNER_TEMP/base-candidate/bin/infralink" version \
            > "$RUNNER_TEMP/entry-version.json"
      - name: Smoke-test exact optional BWS wheel offline
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/bws-candidate"
          PIP_NO_INDEX=1 "$RUNNER_TEMP/bws-candidate/bin/python" -m pip install \
            --find-links bws-wheelhouse \
            "dist/infralink-0.2.0-py3-none-any.whl[bws]"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/bws-candidate/bin/python" -c \
            "import bitwarden_sdk; from infralink.adapters.bws import BwsSecretResolver"
      - name: Scan candidate output for the secret canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/artifact-scan"
          tar -xzf dist/infralink-0.2.0.tar.gz -C "$RUNNER_TEMP/artifact-scan"
          unzip -q dist/infralink-0.2.0-py3-none-any.whl \
            -d "$RUNNER_TEMP/artifact-scan/wheel"
          ! rg -a "infralink-secret-canary-47291" \
            "$RUNNER_TEMP/artifact-scan" \
            "$RUNNER_TEMP/module-version.json" "$RUNNER_TEMP/entry-version.json"
      - name: Build deterministic release manifest
        run: >-
          python scripts/build_release_manifest.py
          --dist dist
          --source-commit "$VERIFIED_SHA"
          --workflow-run-id "${{ github.run_id }}"
          --output dist/manifest.json
      - name: Verify release checksums and exact files
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
      # actions/attest-build-provenance v3.2.0 (dereferenced tag commit)
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: |-
            dist/infralink-0.2.0-py3-none-any.whl
            dist/infralink-0.2.0.tar.gz
            dist/manifest.json
            dist/SHA256SUMS
      # actions/upload-artifact v4.6.2
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infralink-v0.2.0-${{ github.sha }}
          path: |-
            dist/infralink-0.2.0-py3-none-any.whl
            dist/infralink-0.2.0.tar.gz
            dist/manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Record candidate provenance
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "## Infralink v0.2.0 candidate"
            echo
            echo "- Source SHA: \`$VERIFIED_SHA\`"
            echo "- Workflow run ID: \`${{ github.run_id }}\`"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
