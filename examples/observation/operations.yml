schema_version: infralink.observation/v1
observation_backends:
  - {id: health-main, kind: health, backend_ref: opaque-observation-backend}
  - {id: logs-main, kind: logs, backend_ref: opaque-logs-backend}
datasource_bindings:
  - {id: live-health, observation_backend_id: health-main, datasource_ref: opaque-datasource}
  - {id: live-logs, observation_backend_id: logs-main, datasource_ref: opaque-log-datasource}
operations_views:
  - id: service-overview
    purpose: Multi-service operations overview
    sections:
      - id: core
        title: Core services
        members:
          - {signal_id: web-up, signal_ref: service/11111111-1111-4111-8111-111111111111/web/health/up, datasource_binding_id: live-health, requirement: required}
          - {signal_id: ci-up, signal_ref: service/22222222-2222-4222-8222-222222222222/ci/health/up, datasource_binding_id: live-health, requirement: required}
          - {signal_id: web-traffic, signal_ref: service/11111111-1111-4111-8111-111111111111/web/access/traffic, datasource_binding_id: live-logs, requirement: optional}
          - {signal_id: ci-failures, signal_ref: service/22222222-2222-4222-8222-222222222222/ci/builds/failures, datasource_binding_id: live-logs, requirement: optional}
readiness_suites:
  - id: ci-release
    members:
      - {id: ci-up, signal_ref: service/22222222-2222-4222-8222-222222222222/ci/health/up, cadence_seconds: 30, continuity_seconds: 300, freshness_seconds: 60, no_data_policy: fail, error_policy: fail}
waivers:
  - id: synthetic-maintenance
    scope: {kind: signal, ref: service/11111111-1111-4111-8111-111111111111/web/health/up}
    owner: example-team
    reason: Synthetic maintenance example
    created_on: '2026-08-01'
    expires_on: '2026-08-10'
